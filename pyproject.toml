[project]
name = "laya-browser"
version = "0.1.0"
description = "agent-browser drop-in with local Laya-MLX natural-language element targeting"
requires-python = ">=3.11"
dependencies = ["laya-mlx @ git+https://github.com/mizorewww/laya-mlx"]

[project.scripts]
laya-browser = "laya_browser:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
